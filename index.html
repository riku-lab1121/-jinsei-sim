<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8ed6ff"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>人生シム 大陸編</title><style>
:root{--ink:#274458;--muted:#7c93a0;--card:#ffffffee;--line:#dcebf0;--green:#68c58a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(#91d7ff,#e7f9ff)}body{padding-bottom:88px}.wrap{max-width:520px;margin:auto;padding:16px 14px 36px}.hero{background:linear-gradient(135deg,#7fd1ff,#a7e9d0);border-radius:30px;padding:20px;position:relative}.hero h1{margin:0;font-size:28px}.datetime{margin-top:12px;background:#ffffffc9;border-radius:18px;padding:11px 14px;font-weight:900;font-size:18px;display:inline-block}.plumbob{position:absolute;right:30px;top:28px;font-size:50px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip,.badge{background:#ffffffc9;border-radius:99px;padding:6px 10px;font-size:12px}.card{background:var(--card);border:1px solid #fff;border-radius:24px;padding:16px;margin-top:14px;box-shadow:0 9px 25px #4e809717}.title{font-size:18px;font-weight:900}.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.big{font-size:30px;font-weight:900}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;border:1px solid #cfe1e8;border-radius:13px;padding:11px;font-size:16px;background:#fff;color:var(--ink)}textarea{min-height:90px}.btn{border:0;border-radius:14px;padding:11px 13px;background:#edf8fc;color:#2e566b;font-weight:800}.btn.primary{background:var(--green);color:white}.btn.danger{background:#ffe9e9;color:#a54343}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.stat{margin:15px 0}.statline{display:flex;justify-content:space-between;align-items:center}.num{width:64px;text-align:center;font-weight:900}input[type=range]{padding:0;border:0}.list{margin-top:8px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.itemhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.amount.plus{color:#2b9d61}.amount.minus{color:#d75b5b}.nav{position:fixed;left:0;right:0;bottom:0;background:#ffffffef;display:flex;justify-content:center;backdrop-filter:blur(14px);z-index:10}.tab{border:0;background:none;padding:10px 13px 8px;color:#72838f;font-size:11px}.tab b{display:block;font-size:21px}.tab.active{color:#2ea263;font-weight:900}.screen{display:none}.screen.active{display:block}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.day,.dow{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:13px}.dow{aspect-ratio:auto;font-size:11px;color:var(--muted)}.day{background:#f5fbfd}.day.today{background:#dff5e7;font-weight:900}.day.has{box-shadow:inset 0 -4px 0 #69c98b}.day.selected{outline:2px solid #5faed9}.note{padding:12px;background:#f6fbfd;border-radius:15px;margin-top:9px}.questdone{opacity:.5;text-decoration:line-through}.notice{padding:10px 12px;border-radius:14px;background:#fff6cf;font-size:12px;margin-top:10px}
</style></head><body><div class="wrap"><div class="hero"><div class="plumbob">◆</div><h1>人生シム 大陸編</h1><div class="datetime" id="dateTime">--</div><div class="chips"><span class="chip">Lv. <span id="level">1</span></span><span class="chip">XP <span id="xp">0</span></span><span class="chip" id="modeChip">通常モード</span></div></div>
<section id="home" class="screen active"><div class="card"><div class="row"><div class="title">💰 家計</div><span class="badge">今月</span></div><div class="grid2" style="margin-top:10px"><div><div class="small">残高</div><div class="big" id="homeBalance">¥0</div></div><div><div class="small">今月収支</div><div class="big" id="monthNet">¥0</div></div></div></div><div class="card"><div class="row"><div class="title">🎯 今日のクエスト</div><button class="btn" onclick="showTab('quests',document.querySelectorAll('.tab')[4])">見る</button></div><div id="homeQuest"></div></div><div class="card"><div class="title">⚡ 今日の状態</div><div id="homeStats"></div></div><div class="card"><div class="row"><div class="title">📝 最近のメモ</div><button class="btn" onclick="openMore()">その他</button></div><div id="homeMemo"></div></div></section>
<section id="status" class="screen"><div class="card"><div class="title">❤️ ステータス</div><div id="stats"></div></div><div class="card"><div class="row"><div class="title">😴 睡眠モード</div><span id="sleepBadge" class="badge">起床中</span></div><button id="sleepBtn" class="btn primary" style="width:100%;margin-top:10px" onclick="toggleSleep()">😴 就寝する</button><div class="notice">起床中は時間経過で欲求が減り、睡眠中は睡眠・体力が回復します。</div></div><div class="card"><div class="title">⚡ 行動</div><div class="actions"><button class="btn" onclick="act('meal')">🍚 食事</button><button class="btn" onclick="act('bath')">🚿 風呂</button><button class="btn" onclick="act('clean')">🧹 片付け</button><button class="btn" onclick="act('fun')">🎮 趣味</button><button class="btn" onclick="act('social')">👥 交流</button><button class="btn" onclick="act('work')">💼 仕事</button></div></div></section>
<section id="money" class="screen"><div class="card"><div class="row"><div class="title">💰 家計簿</div><span class="badge">自動保存</span></div><div class="grid2" style="margin-top:10px"><div><div class="small">残高</div><div class="big" id="balance">¥0</div></div><div><div class="small">今月収支</div><div class="big" id="net">¥0</div></div></div></div><div class="card"><div class="title">＋ 取引を記録</div><div class="grid2" style="margin-top:10px"><select id="txType"><option value="expense">支出</option><option value="income">収入</option></select><select id="txCategory"><option>食費</option><option>交通</option><option>固定費</option><option>車</option><option>趣味</option><option>日用品</option><option>給料</option><option>その他</option></select></div><input id="txAmount" type="number" inputmode="numeric" placeholder="金額" style="margin-top:9px"><input id="txMemo" type="text" placeholder="メモ（例：昼ごはん）" style="margin-top:9px"><input id="txDate" type="date" style="margin-top:9px"><button class="btn primary" style="width:100%;margin-top:10px" onclick="addTransaction()">記録する</button></div><div class="card"><div class="row"><div class="title">📒 履歴</div><button class="btn danger" onclick="clearTransactions()">履歴削除</button></div><div id="txList" class="list"></div></div></section>
<section id="calendar" class="screen"><div class="card"><div class="row"><button class="btn" onclick="changeMonth(-1)">←</button><div class="title" id="calTitle"></div><button class="btn" onclick="changeMonth(1)">→</button></div><div class="calendar" id="calendarGrid"></div></div><div class="card"><div class="title">📅 選択日の予定・記録</div><div class="small" id="selectedDateText"></div><input id="eventTitle" type="text" placeholder="予定タイトル" style="margin-top:10px"><input id="eventTime" type="time" style="margin-top:9px"><textarea id="eventMemo" placeholder="予定メモ" style="margin-top:9px"></textarea><button class="btn primary" style="width:100%" onclick="addEvent()">予定を追加</button><div id="eventList" class="list"></div></div></section>
<section id="quests" class="screen"><div class="card"><div class="title">🎯 クエスト作成</div><input id="questTitle" type="text" placeholder="クエスト名" style="margin-top:10px"><div class="grid2" style="margin-top:9px"><input id="questDue" type="date"><input id="questXP" type="number" inputmode="numeric" placeholder="獲得XP" value="10"></div><select id="questDifficulty" style="margin-top:9px"><option>かんたん</option><option>普通</option><option>むずかしい</option></select><textarea id="questMemo" placeholder="メモ" style="margin-top:9px"></textarea><button class="btn primary" style="width:100%" onclick="addQuest()">クエスト追加</button></div><div class="card"><div class="title">📜 クエスト一覧</div><div id="questList"></div></div></section>
<section id="more" class="screen"><div class="card"><div class="title">📝 メモ</div><textarea id="memoText" placeholder="思いついたこと、買うもの、気になること…"></textarea><button class="btn primary" style="width:100%" onclick="addMemo()">メモ保存</button><div id="memoList"></div></div><div class="card"><div class="title">📈 スキル</div><div class="item">🍳 料理 <b>Lv.1</b></div><div class="item">🚗 運転 <b>Lv.1</b></div><div class="item">🧹 片付け <b>Lv.1</b></div><div class="item">💴 お金管理 <b>Lv.1</b></div></div></section></div>
<nav class="nav"><button class="tab active" onclick="showTab('home',this)"><b>🏠</b>ホーム</button><button class="tab" onclick="showTab('status',this)"><b>❤️</b>状態</button><button class="tab" onclick="showTab('money',this)"><b>💰</b>家計簿</button><button class="tab" onclick="showTab('calendar',this)"><b>📅</b>予定</button><button class="tab" onclick="showTab('quests',this)"><b>🎯</b>クエスト</button></nav>
<script>
const KEY='jinseiSimV4',def={money:0,xp:0,level:1,isSleeping:false,lastUpdate:Date.now(),stats:{体力:70,メンタル:60,空腹:70,睡眠:40,衛生:40,楽しさ:20,社交:40,住環境:20},transactions:[],events:[],quests:[],memos:[]};let d=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(def));for(const k of Object.keys(def)){if(d[k]===undefined)d[k]=JSON.parse(JSON.stringify(def[k]))}const icons={体力:'❤️',メンタル:'🧠',空腹:'🍚',睡眠:'😴',衛生:'🚿',楽しさ:'🎮',社交:'👥',住環境:'🏠'},colors={体力:'#68c58a',メンタル:'#e99aba',空腹:'#f3a55d',睡眠:'#67b9e8',衛生:'#65c7bd',楽しさ:'#9a8be0',社交:'#e7c45b',住環境:'#c78f65'},awake={体力:-2,空腹:-4,睡眠:-3,衛生:-1,楽しさ:-.5,社交:-.35,住環境:0},sleep={体力:6,空腹:-1.5,睡眠:14,衛生:-.35,楽しさ:0,社交:0,住環境:0};let calDate=new Date(),selectedDate=fmtDate(new Date());function clamp(v){return Math.max(0,Math.min(100,v))}function save(){localStorage.setItem(KEY,JSON.stringify(d))}function fmtDate(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}function updateClock(){const n=new Date(),ds=['日','月','火','水','木','金','土'];dateTime.textContent=`${n.getMonth()+1}月${n.getDate()}日（${ds[n.getDay()]}） ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`}function applyElapsed(){const now=Date.now();let h=(now-d.lastUpdate)/3600000;if(h<=0)return;h=Math.min(h,72);const r=d.isSleeping?sleep:awake;for(const k in r)d.stats[k]=clamp(d.stats[k]+r[k]*h);if(d.isSleeping)d.stats.メンタル=clamp(d.stats.メンタル+.7*h);else{const low=[d.stats.体力,d.stats.空腹,d.stats.睡眠,d.stats.楽しさ].filter(v=>v<25).length;d.stats.メンタル=clamp(d.stats.メンタル+(low?-(low*.8*h):(.15*h)))}d.lastUpdate=now;save()}function showTab(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function openMore(){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));more.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));render()}function setStat(k,v){d.stats[k]=clamp(Number(v)||0);save();render()}function toggleSleep(){applyElapsed();d.isSleeping=!d.isSleeping;d.lastUpdate=Date.now();save();render()}function act(t){applyElapsed();const s=d.stats,m={meal:{空腹:30,体力:4},bath:{衛生:30,メンタル:3},clean:{住環境:10,衛生:3,メンタル:3,楽しさ:-2},fun:{楽しさ:25,メンタル:8,睡眠:-3},social:{社交:22,メンタル:6},work:{体力:-12,メンタル:-6,空腹:-8,睡眠:-5}}[t];for(const k in m)s[k]=clamp(s[k]+m[k]);if(t==='meal'){d.money-=800;d.transactions.unshift({id:Date.now(),type:'expense',category:'食費',amount:800,memo:'食事',date:fmtDate(new Date())})}if(t==='work'){d.money+=5000;d.transactions.unshift({id:Date.now(),type:'income',category:'給料',amount:5000,memo:'仕事',date:fmtDate(new Date())})}d.lastUpdate=Date.now();save();render()}function addTransaction(){const type=txType.value,category=txCategory.value,amount=Number(txAmount.value),memo=txMemo.value.trim(),date=txDate.value||fmtDate(new Date());if(!amount||amount<0)return alert('金額を入力してください');d.transactions.unshift({id:Date.now(),type,category,amount,memo,date});d.money+=type==='income'?amount:-amount;txAmount.value='';txMemo.value='';save();render()}function clearTransactions(){if(confirm('家計簿の履歴をすべて削除しますか？')){d.transactions=[];save();render()}}function monthSummary(){const n=new Date(),p=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');let inc=0,exp=0;d.transactions.filter(x=>x.date.startsWith(p)).forEach(x=>x.type==='income'?inc+=x.amount:exp+=x.amount);return{inc,exp,net:inc-exp}}function addQuest(){const title=questTitle.value.trim();if(!title)return alert('クエスト名を入力してください');d.quests.unshift({id:Date.now(),title,due:questDue.value,xp:Number(questXP.value)||10,diff:questDifficulty.value,memo:questMemo.value.trim(),done:false});questTitle.value='';questMemo.value='';save();render()}function completeQuest(id){const q=d.quests.find(x=>x.id===id);if(!q||q.done)return;q.done=true;d.xp+=q.xp;while(d.xp>=100){d.xp-=100;d.level++}save();render()}function deleteQuest(id){d.quests=d.quests.filter(x=>x.id!==id);save();render()}function addMemo(){const text=memoText.value.trim();if(!text)return;d.memos.unshift({id:Date.now(),text,date:new Date().toLocaleString('ja-JP')});memoText.value='';save();render()}function deleteMemo(id){d.memos=d.memos.filter(x=>x.id!==id);save();render()}function addEvent(){const title=eventTitle.value.trim();if(!title)return alert('予定タイトルを入力してください');d.events.push({id:Date.now(),date:selectedDate,time:eventTime.value,title,memo:eventMemo.value.trim()});eventTitle.value='';eventTime.value='';eventMemo.value='';save();renderCalendar();render()}function deleteEvent(id){d.events=d.events.filter(x=>x.id!==id);save();renderCalendar();render()}function changeMonth(delta){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+delta,1);renderCalendar()}function selectDay(date){selectedDate=date;renderCalendar();render()}function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();calTitle.textContent=`${y}年 ${m+1}月`;const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=fmtDate(new Date());let html=['日','月','火','水','木','金','土'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<first;i++)html+='<div></div>';for(let day=1;day<=days;day++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,has=d.events.some(e=>e.date===date)||d.quests.some(q=>q.due===date)||d.transactions.some(t=>t.date===date);html+=`<div class="day ${date===today?'today':''} ${has?'has':''} ${date===selectedDate?'selected':''}" onclick="selectDay('${date}')">${day}</div>`}calendarGrid.innerHTML=html;selectedDateText.textContent=selectedDate}function statMarkup(limit=99){return Object.entries(d.stats).slice(0,limit).map(([k,v])=>`<div class="stat"><div class="statline"><span>${icons[k]} ${k}</span><input class="num" type="number" min="0" max="100" value="${Math.round(v)}" onchange="setStat('${k}',this.value)"></div><input type="range" min="0" max="100" value="${Math.round(v)}" style="accent-color:${colors[k]}" oninput="setStat('${k}',this.value)"></div>`).join('')}function render(){const ms=monthSummary();homeBalance.textContent='¥'+Math.round(d.money).toLocaleString();monthNet.textContent=(ms.net>=0?'+':'')+'¥'+Math.round(ms.net).toLocaleString();balance.textContent='¥'+Math.round(d.money).toLocaleString();net.textContent=(ms.net>=0?'+':'')+'¥'+Math.round(ms.net).toLocaleString();level.textContent=d.level;xp.textContent=d.xp;modeChip.textContent=d.isSleeping?'睡眠モード':'通常モード';stats.innerHTML=statMarkup();homeStats.innerHTML=Object.entries(d.stats).slice(0,5).map(([k,v])=>`<div class="stat"><div class="statline"><span>${icons[k]} ${k}</span><b>${Math.round(v)}</b></div><input type="range" min="0" max="100" value="${Math.round(v)}" disabled style="accent-color:${colors[k]}"></div>`).join('');sleepBadge.textContent=d.isSleeping?'睡眠中':'起床中';sleepBtn.textContent=d.isSleeping?'☀️ 起床する':'😴 就寝する';const today=fmtDate(new Date()),hq=d.quests.find(q=>!q.done&&(q.due===today||!q.due))||d.quests.find(q=>!q.done);homeQuest.innerHTML=hq?`<div class="item"><b>${hq.title}</b><div class="small">${hq.due||'期限なし'} / XP ${hq.xp}</div></div>`:'<div class="small" style="margin-top:10px">未完了クエストはありません。</div>';homeMemo.innerHTML=d.memos[0]?`<div class="note">${d.memos[0].text}<div class="small">${d.memos[0].date}</div></div>`:'<div class="small" style="margin-top:10px">メモはまだありません。</div>';txList.innerHTML=d.transactions.length?d.transactions.slice(0,50).map(t=>`<div class="item"><div class="itemhead"><div><b>${t.category}</b><div class="small">${t.date} ${t.memo||''}</div></div><b class="amount ${t.type==='income'?'plus':'minus'}">${t.type==='income'?'+':'-'}¥${t.amount.toLocaleString()}</b></div></div>`).join(''):'<div class="small">履歴はありません。</div>';questList.innerHTML=d.quests.length?d.quests.map(q=>`<div class="item ${q.done?'questdone':''}"><div class="itemhead"><div><b>${q.title}</b><div class="small">${q.diff} / ${q.due||'期限なし'} / XP ${q.xp}</div>${q.memo?`<div class="small">${q.memo}</div>`:''}</div><div>${!q.done?`<button class="btn primary" onclick="completeQuest(${q.id})">達成</button>`:''}<button class="btn danger" onclick="deleteQuest(${q.id})">削除</button></div></div></div>`).join(''):'<div class="small">クエストはまだありません。</div>';memoList.innerHTML=d.memos.length?d.memos.map(m=>`<div class="note">${m.text}<div class="row"><span class="small">${m.date}</span><button class="btn danger" onclick="deleteMemo(${m.id})">削除</button></div></div>`).join(''):'<div class="small">メモはまだありません。</div>';const ev=d.events.filter(e=>e.date===selectedDate).sort((a,b)=>(a.time||'').localeCompare(b.time||''));eventList.innerHTML=ev.length?ev.map(e=>`<div class="item"><div class="itemhead"><div><b>${e.time||'--:--'} ${e.title}</b><div class="small">${e.memo||''}</div></div><button class="btn danger" onclick="deleteEvent(${e.id})">削除</button></div></div>`).join(''):'<div class="small">この日の予定はありません。</div>'}txDate.value=fmtDate(new Date());questDue.value=fmtDate(new Date());applyElapsed();renderCalendar();render();updateClock();setInterval(updateClock,1000);setInterval(()=>{applyElapsed();render()},60000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script></body></html>
