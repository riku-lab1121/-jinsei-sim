<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8ed6ff"><link rel="manifest" href="manifest.webmanifest"><title>人生シム</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#29495d;background:linear-gradient(#8ed8ff,#e9fbff);padding-bottom:82px}main{max-width:520px;margin:auto;padding:16px 14px 40px}.hero,.card{background:#fffffff0;border-radius:28px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#7fd1ff,#a8ead1);position:relative}.hero h1{margin:0 55px 10px 0;font-size:29px}.diamond{position:absolute;right:28px;top:30px;font-size:50px}.clock{font-weight:900;font-size:19px;background:#ffffffc9;display:inline-block;padding:10px 14px;border-radius:17px}h2{font-size:20px;margin:0 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.big{font-size:29px;font-weight:900}.muted{color:#8198a5;font-size:13px}button,input,select,textarea{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #cfe2e9;border-radius:13px;background:white;margin:5px 0}textarea{min-height:80px}button{border:0;border-radius:13px;padding:10px 12px;font-weight:800;background:#edf8fc;color:#31596e}.primary{background:#66c68a;color:white}.danger{background:#ffeaea;color:#a54d4d}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:11px 0;border-bottom:1px solid #deebef}.mood{display:flex;gap:7px}.mood button{flex:1;font-size:24px;padding:11px 3px}.mood .sel{outline:3px solid #67c58b;background:#e9faef}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffef5;display:flex;justify-content:center;z-index:10}.tab{background:none;padding:9px 11px 7px;color:#748895;font-size:10px}.tab b{font-size:21px;display:block}.tab.active{color:#2fa363}.screen{display:none}.screen.active{display:block}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:#8299a6}.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#f5fbfd;border-radius:11px;font-size:13px}.today{background:#dff6e7;font-weight:900}.selected{outline:2px solid #5eafd9}.has{box-shadow:inset 0 -4px #66c68a}.photo{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-top:8px}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calcout{font-size:25px;font-weight:900;text-align:right;padding:10px;background:#f5fbfd;border-radius:13px}.note{background:#f5fbfd;border-radius:14px;padding:11px;margin-top:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#edf7fa;padding:4px;border-radius:14px;margin-bottom:12px}.seg button.active{background:white;box-shadow:0 2px 8px #56788a18}
.tl-date{font-size:17px;font-weight:900;margin:16px 0 6px}.tl{position:relative;padding-left:24px}.tl:before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:2px;background:#d5e8ee}.tl-item{position:relative;background:#f7fbfd;border-radius:15px;padding:11px 12px;margin:8px 0}.tl-item:before{content:"";position:absolute;left:-20px;top:16px;width:10px;height:10px;border-radius:50%;background:#67c58b;border:2px solid white}.tl-time{font-size:11px;color:#8299a6}.summarybox{background:#f5fbfd;border-radius:16px;padding:12px}.summarynum{font-size:22px;font-weight:900}.reward{background:linear-gradient(135deg,#fff8d6,#fffdf1);border:1px solid #f2df8c;border-radius:18px;padding:13px;margin-top:10px}.reward.unlocked{background:linear-gradient(135deg,#e6f9ed,#f7fff9);border-color:#82d59f}.progress{height:10px;background:#e7eef1;border-radius:99px;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:#66c68a;border-radius:99px}.resultBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.achieve{background:#def7e7;color:#287b4a}.miss{background:#ffeded;color:#a74c4c}.pending{background:#eef5f8;color:#667c89}.resultTag{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:900;margin-top:5px}.resultTag.achieved{background:#dff7e8;color:#277d4b}.resultTag.missed{background:#ffe9e9;color:#a54a4a}.resultTag.pending{background:#edf3f6;color:#718590}.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.miniPhoto{width:70px;height:70px;object-fit:cover;border-radius:12px;margin-top:6px}
</style></head><body><main>
<div class="hero"><div class="diamond">◆</div><h1 id="appTitle"></h1><div class="clock" id="clock"></div><div class="muted" style="margin-top:10px">現実を少しだけゲームっぽく記録する。</div></div>
<section id="home" class="screen active"><div class="card"><h2>☀️ 今日の調子</h2><div class="mood" id="moods"></div><div id="moodText" class="muted"></div></div><div class="card"><h2>💰 今月</h2><div class="grid2"><div><div class="muted">残高</div><div class="big" id="homeBal"></div></div><div><div class="muted">今月収支</div><div class="big" id="homeNet"></div></div></div></div><div class="card"><div class="row"><h2>🎯 次のクエスト</h2><button onclick="tab('quests')">見る</button></div><div id="nextQuest" class="muted"></div></div><div class="card"><div class="row"><h2>🎁 ご褒美</h2><button onclick="tab('quests')">設定</button></div><div id="rewardHome"></div></div><div class="card"><div class="row"><h2>📝 最近のメモ</h2><button onclick="tab('more')">メモ</button></div><div id="recentMemo" class="muted"></div></div></section>
<section id="money" class="screen"><div class="card"><h2>💰 家計簿</h2><div class="grid2"><div><div class="muted">残高</div><div class="big" id="bal"></div></div><div><div class="muted">今月収支</div><div class="big" id="net"></div></div></div></div><div class="card"><h2>🧮 電卓</h2><div class="calcout" id="calcOut">0</div><div class="calc" id="calc"></div><button style="width:100%;margin-top:8px" onclick="useCalc()">結果を金額に入れる</button></div><div class="card"><h2>＋ 記録</h2><div class="grid2"><select id="txType"><option value="expense">支出</option><option value="income">収入</option></select><select id="txCat"><option>食費</option><option>交通</option><option>固定費</option><option>車</option><option>趣味</option><option>日用品</option><option>給料</option><option>その他</option></select></div><input id="txAmount" type="number" inputmode="decimal" placeholder="金額"><input id="txMemo" placeholder="メモ"><input id="txDate" type="date"><button class="primary" style="width:100%" onclick="addTx()">記録</button></div><div class="card"><h2>📒 履歴</h2><div id="txList"></div></div></section>
<section id="calendar" class="screen"><div class="card"><div class="row"><button onclick="month(-1)">←</button><h2 id="calTitle"></h2><button onclick="month(1)">→</button></div><div class="calendar" id="cal"></div></div><div class="card"><h2>📅 <span id="selDate"></span></h2><input id="eventTitle" placeholder="予定"><input id="eventTime" type="time"><textarea id="eventMemo" placeholder="メモ"></textarea><button class="primary" style="width:100%" onclick="addEvent()">予定を追加</button><input id="photoInput" type="file" accept="image/*"><input id="photoCaption" placeholder="写真のひとこと"><button style="width:100%" onclick="addPhoto()">📷 写真を追加</button><div id="dayLog"></div></div></section>

<section id="timeline" class="screen">
<div class="card">
  <div class="row"><h2>🕒 タイムライン</h2><span class="muted">人生ログ</span></div>
  <div class="seg"><button id="dayModeBtn" class="active" onclick="setTimelineMode('day')">日ごと</button><button id="monthModeBtn" onclick="setTimelineMode('month')">月ごと</button></div>
  <div id="timelineDay">
    <div class="row"><button onclick="moveTimelineDay(-1)">← 前日</button><b id="timelineDayTitle"></b><button onclick="moveTimelineDay(1)">翌日 →</button></div>
    <div id="dayTimeline"></div>
  </div>
  <div id="timelineMonth" style="display:none">
    <div class="monthnav"><button onclick="moveTimelineMonth(-1)">←</button><b id="timelineMonthTitle"></b><button onclick="moveTimelineMonth(1)">→</button></div>
    <div class="grid2">
      <div class="summarybox"><div class="muted">収支</div><div class="summarynum" id="tmNet"></div></div>
      <div class="summarybox"><div class="muted">支出</div><div class="summarynum" id="tmExpense"></div></div>
      <div class="summarybox"><div class="muted">完了クエスト</div><div class="summarynum" id="tmQuest"></div></div>
      <div class="summarybox"><div class="muted">写真 / メモ</div><div class="summarynum" id="tmLogs"></div></div>
    </div>
    <div id="monthTimeline"></div>
  </div>
</div>
</section>
<section id="quests" class="screen"><div class="card"><h2>🎯 クエスト作成</h2><input id="qTitle" placeholder="クエスト名"><input id="qDue" type="date"><textarea id="qMemo" placeholder="メモ"></textarea><button class="primary" style="width:100%" onclick="addQuest()">追加</button></div><div class="card"><h2>🎁 ご褒美設定</h2><div class="muted">週間</div><div class="grid2"><input id="weekThreshold" type="number" min="1" max="100" inputmode="numeric" placeholder="必要達成率 %"><input id="weekReward" placeholder="例：好きな物を食べる"></div><div class="muted" style="margin-top:8px">月間</div><div class="grid2"><input id="monthThreshold" type="number" min="1" max="100" inputmode="numeric" placeholder="必要達成率 %"><input id="monthReward" placeholder="例：欲しい物を買う"></div><button class="primary" style="width:100%;margin-top:8px" onclick="saveRewards()">ご褒美設定を保存</button><div class="muted" style="margin-top:8px">期間内のクエストをすべて「達成 / 未達成」にした時点でご褒美を判定します。</div></div><div class="card"><h2>📜 クエスト</h2><div id="qList"></div></div></section>
<section id="more" class="screen"><div class="card"><h2>📝 メモ</h2><textarea id="memo" placeholder="自由にメモ…"></textarea><button class="primary" style="width:100%" onclick="addMemo()">保存</button><div id="memoList"></div></div><div class="card"><h2>⚙️ 設定</h2><div class="muted">アプリ内の名前</div><input id="titleInput"><button style="width:100%" onclick="renameApp()">名前を変更</button><button style="width:100%;margin-top:12px" onclick="exportData()">📤 バックアップ</button><input id="restore" type="file" accept=".json"><button style="width:100%" onclick="restoreData()">📥 復元</button></div></section>
</main><nav class="nav"><button class="tab active" data-id="home" onclick="tab('home')"><b>🏠</b>ホーム</button><button class="tab" data-id="money" onclick="tab('money')"><b>💰</b>家計簿</button><button class="tab" data-id="calendar" onclick="tab('calendar')"><b>📅</b>予定</button><button class="tab" data-id="timeline" onclick="tab('timeline')"><b>🕒</b>ログ</button><button class="tab" data-id="quests" onclick="tab('quests')"><b>🎯</b>クエスト</button></nav>
<script>
const K='jinseiSimV41';let D=JSON.parse(localStorage.getItem(K)||'null')||{title:'人生シム 大陸編',money:0,mood:{},tx:[],events:[],quests:[],memos:[],rewards:{weekThreshold:80,weekReward:'',monthThreshold:80,monthReward:''}};if(!D.rewards)D.rewards={weekThreshold:80,weekReward:'',monthThreshold:80,monthReward:''};(D.quests||[]).forEach(q=>{if(!q.status)q.status=q.done?'achieved':'pending';if(!q.resultAt&&q.completedAt)q.resultAt=q.completedAt});let selected=dk(new Date()),view=new Date(),expr='';
function $(x){return document.getElementById(x)}function save(){localStorage.setItem(K,JSON.stringify(D))}function dk(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function tick(){let n=new Date(),w='日月火水木金土'[n.getDay()];$('clock').textContent=`${n.getMonth()+1}月${n.getDate()}日（${w}） ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`}
function tab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));render()}
function summary(){let n=new Date(),p=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'),v=0;D.tx.filter(x=>x.date.startsWith(p)).forEach(x=>v+=x.type==='income'?x.amount:-x.amount);return v}
function setMood(v){let k=dk(new Date());D.mood[k]={value:v,createdAt:Date.now()};save();render()}
function moodValue(k){let v=D.mood[k];return typeof v==='string'?v:(v&&v.value)||null}
function addTx(){let a=Number($('txAmount').value);if(!a)return alert('金額を入力してください');D.tx.unshift({id:Date.now(),type:$('txType').value,cat:$('txCat').value,amount:a,memo:$('txMemo').value,date:$('txDate').value||dk(new Date()),createdAt:Date.now()});D.money+=$('txType').value==='income'?a:-a;$('txAmount').value='';$('txMemo').value='';save();render()}
function addQuest(){if(!$('qTitle').value.trim())return;D.quests.unshift({id:Date.now(),title:$('qTitle').value.trim(),due:$('qDue').value,memo:$('qMemo').value,status:'pending',createdAt:Date.now(),resultAt:null});$('qTitle').value='';$('qMemo').value='';save();render()}
function setQuestResult(id,status){let q=D.quests.find(x=>x.id===id);if(!q)return;q.status=status;q.done=status==='achieved';q.resultAt=Date.now();q.completedAt=status==='achieved'?q.resultAt:null;save();render()}
function resetQuestResult(id){let q=D.quests.find(x=>x.id===id);if(!q)return;q.status='pending';q.done=false;q.resultAt=null;q.completedAt=null;save();render()}
function addMemo(){if(!$('memo').value.trim())return;D.memos.unshift({id:Date.now(),text:$('memo').value.trim(),date:new Date().toLocaleString('ja-JP'),createdAt:Date.now()});$('memo').value='';save();render()}function delMemo(id){D.memos=D.memos.filter(x=>x.id!==id);save();render()}
function addEvent(){if(!$('eventTitle').value.trim())return;D.events.push({id:Date.now(),kind:'event',date:selected,title:$('eventTitle').value.trim(),time:$('eventTime').value,memo:$('eventMemo').value,createdAt:Date.now()});$('eventTitle').value='';$('eventMemo').value='';save();render()}function delEvent(id){D.events=D.events.filter(x=>x.id!==id);save();render()}
function month(v){view=new Date(view.getFullYear(),view.getMonth()+v,1);renderCal();renderTimeline()}function pick(k){selected=k;render()}
async function addPhoto(){let f=$('photoInput').files[0];if(!f)return alert('写真を選んでください');let data=await resize(f);D.events.push({id:Date.now(),kind:'photo',date:selected,title:$('photoCaption').value||'写真',data,createdAt:Date.now()});try{save()}catch(e){D.events.pop();return alert('保存容量がいっぱいです')} $('photoInput').value='';$('photoCaption').value='';render()}
function resize(f){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.65))};im.src=fr.result};fr.readAsDataURL(f)})}
function renameApp(){let v=$('titleInput').value.trim();if(v){D.title=v;save();render()}}
function exportData(){let b=new Blob([JSON.stringify(D)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jinsei-sim-backup-'+dk(new Date())+'.json';a.click()}
function restoreData(){let f=$('restore').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();render();alert('復元しました')}catch(e){alert('読み込めませんでした')}};r.readAsText(f)}
function cp(v){if(v==='C')expr='';else if(v==='⌫')expr=expr.slice(0,-1);else if(v==='='){try{let s=expr.replaceAll('×','*').replaceAll('÷','/');if(!/^[0-9+*/(). -]+$/.test(s))throw 0;expr=String(Math.round(Function('return ('+s+')')()*100)/100)}catch(e){expr='エラー'}}else{if(expr==='エラー')expr='';expr+=v}$('calcOut').textContent=expr||'0'}function useCalc(){let n=Number(expr);if(isFinite(n))$('txAmount').value=Math.abs(n)}

let timelineMode='day',timelineDate=new Date(),timelineMonthDate=new Date();

function setTimelineMode(mode){
 timelineMode=mode;
 $('dayModeBtn').classList.toggle('active',mode==='day');
 $('monthModeBtn').classList.toggle('active',mode==='month');
 $('timelineDay').style.display=mode==='day'?'block':'none';
 $('timelineMonth').style.display=mode==='month'?'block':'none';
 renderTimeline();
}
function moveTimelineDay(n){timelineDate.setDate(timelineDate.getDate()+n);renderTimeline()}
function moveTimelineMonth(n){timelineMonthDate=new Date(timelineMonthDate.getFullYear(),timelineMonthDate.getMonth()+n,1);renderTimeline()}
function timeOf(ts){if(!ts)return '';let d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function eventTimeToMinutes(t){if(!t)return 0;let p=t.split(':');return Number(p[0])*60+Number(p[1])}
function timelineItemsForDate(k){
 let a=[];
 D.tx.filter(x=>x.date===k).forEach(x=>a.push({sort:x.createdAt||x.id||0,time:timeOf(x.createdAt||x.id),icon:'💰',text:`${x.cat} ${x.type==='income'?'+':'-'}¥${x.amount.toLocaleString()}`,sub:x.memo||''}));
 D.events.filter(x=>x.date===k).forEach(x=>{
   if(x.kind==='photo') a.push({sort:x.createdAt||x.id||0,time:timeOf(x.createdAt||x.id),icon:'📷',text:x.title||'写真',photo:x.data});
   else a.push({sort:x.time?eventTimeToMinutes(x.time)*60000:(x.createdAt||x.id||0),time:x.time||timeOf(x.createdAt||x.id),icon:'📅',text:x.title,sub:x.memo||''});
 });
 D.memos.forEach(x=>{let ts=x.createdAt||x.id||0;if(ts&&dk(new Date(ts))===k)a.push({sort:ts,time:timeOf(ts),icon:'📝',text:x.text})});
 D.quests.filter(x=>x.status==='achieved'||x.status==='missed').forEach(x=>{let ts=x.resultAt||x.completedAt||0;if(ts&&dk(new Date(ts))===k)a.push({sort:ts,time:timeOf(ts),icon:x.status==='achieved'?'✅':'❌',text:`${x.title} — ${x.status==='achieved'?'達成':'未達成'}`,sub:x.memo||''})});
 let mv=moodValue(k),mr=D.mood[k]; if(mv)a.push({sort:(mr&&mr.createdAt)||0,time:timeOf((mr&&mr.createdAt)||0),icon:'☀️',text:'今日の調子：'+mv});
 return a.sort((x,y)=>y.sort-x.sort);
}
function renderTimeline(){
 let k=dk(timelineDate),days='日月火水木金土',items=timelineItemsForDate(k);
 $('timelineDayTitle').textContent=`${timelineDate.getMonth()+1}/${timelineDate.getDate()}（${days[timelineDate.getDay()]}）`;
 $('dayTimeline').innerHTML=items.length?`<div class="tl">${items.map(x=>`<div class="tl-item"><div class="tl-time">${x.time||'記録'}</div><b>${x.icon} ${x.text}</b>${x.sub?`<div class="muted">${x.sub}</div>`:''}${x.photo?`<img class="miniPhoto" src="${x.photo}">`:''}</div>`).join('')}</div>`:'<div class="muted" style="padding:18px 0">この日の記録はまだありません。</div>';

 let y=timelineMonthDate.getFullYear(),m=timelineMonthDate.getMonth(),prefix=`${y}-${String(m+1).padStart(2,'0')}`;
 $('timelineMonthTitle').textContent=`${y}年${m+1}月`;
 let tx=D.tx.filter(x=>x.date.startsWith(prefix)),inc=0,exp=0;tx.forEach(x=>x.type==='income'?inc+=x.amount:exp+=x.amount);
 let monthResolved=D.quests.filter(x=>(x.status==='achieved'||x.status==='missed')&&(x.resultAt||x.completedAt)&&dk(new Date(x.resultAt||x.completedAt)).startsWith(prefix));let completed=monthResolved.filter(x=>x.status==='achieved').length,missed=monthResolved.filter(x=>x.status==='missed').length;
 let photos=D.events.filter(x=>x.kind==='photo'&&x.date.startsWith(prefix)).length;
 let memos=D.memos.filter(x=>{let ts=x.createdAt||x.id||0;return ts&&dk(new Date(ts)).startsWith(prefix)}).length;
 $('tmNet').textContent=(inc-exp>=0?'+':'')+'¥'+(inc-exp).toLocaleString();$('tmExpense').textContent='¥'+exp.toLocaleString();$('tmQuest').textContent=`${completed}達成 / ${missed}未達成`;$('tmLogs').textContent=`${photos} / ${memos}`;
 let daysIn=new Date(y,m+1,0).getDate(),blocks=[];
 for(let day=daysIn;day>=1;day--){let kd=`${prefix}-${String(day).padStart(2,'0')}`,it=timelineItemsForDate(kd);if(it.length)blocks.push(`<div class="tl-date">${m+1}月${day}日</div><div class="tl">${it.slice(0,8).map(x=>`<div class="tl-item"><div class="tl-time">${x.time||'記録'}</div><b>${x.icon} ${x.text}</b>${x.photo?`<img class="miniPhoto" src="${x.photo}">`:''}</div>`).join('')}</div>`)};
 $('monthTimeline').innerHTML=blocks.join('')||'<div class="muted" style="padding:18px 0">この月の記録はまだありません。</div>';
}


function questPlanDate(q){if(q.due)return q.due;let ts=q.createdAt||q.id||Date.now();return dk(new Date(ts))}
function weekBounds(base=new Date()){let d=new Date(base.getFullYear(),base.getMonth(),base.getDate()),day=d.getDay(),diff=(day+6)%7;let s=new Date(d);s.setDate(d.getDate()-diff);let e=new Date(s);e.setDate(s.getDate()+6);return [dk(s),dk(e)]}
function monthPrefix(base=new Date()){return base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0')}
function periodStats(kind,base=new Date()){let qs;if(kind==='week'){let [s,e]=weekBounds(base);qs=D.quests.filter(q=>{let p=questPlanDate(q);return p>=s&&p<=e})}else{let p=monthPrefix(base);qs=D.quests.filter(q=>questPlanDate(q).startsWith(p))}let achieved=qs.filter(q=>q.status==='achieved').length,missed=qs.filter(q=>q.status==='missed').length,pending=qs.filter(q=>!q.status||q.status==='pending').length;let judged=achieved+missed,rate=judged?Math.round(achieved/judged*100):0;return {total:qs.length,achieved,missed,pending,judged,rate}}
function rewardState(kind){let s=periodStats(kind),threshold=Number(kind==='week'?D.rewards.weekThreshold:D.rewards.monthThreshold)||80,reward=kind==='week'?D.rewards.weekReward:D.rewards.monthReward;let unlocked=s.total>0&&s.pending===0&&s.rate>=threshold;return {...s,threshold,reward,unlocked}}
function rewardMarkup(kind,label){let r=rewardState(kind),pct=Math.min(100,r.rate);return `<div class="reward ${r.unlocked?'unlocked':''}"><div class="row"><b>${label}</b><b>${r.rate}% / ${r.threshold}%</b></div><div class="progress"><div style="width:${pct}%"></div></div><div class="muted">✅ ${r.achieved}　❌ ${r.missed}　⏳ ${r.pending}</div><div style="margin-top:7px"><b>${r.unlocked?'🎉 ご褒美アンロック！':'🎁 '+(r.reward||'ご褒美未設定')}</b></div>${r.unlocked&&r.reward?`<div>${r.reward}</div>`:''}</div>`}
function saveRewards(){D.rewards.weekThreshold=Math.max(1,Math.min(100,Number($('weekThreshold').value)||80));D.rewards.weekReward=$('weekReward').value.trim();D.rewards.monthThreshold=Math.max(1,Math.min(100,Number($('monthThreshold').value)||80));D.rewards.monthReward=$('monthReward').value.trim();save();render()}

function renderCal(){let y=view.getFullYear(),m=view.getMonth(),f=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$('calTitle').textContent=`${y}年${m+1}月`;let h='日月火水木金土'.split('').map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<f;i++)h+='<div></div>';for(let i=1;i<=days;i++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,has=D.events.some(x=>x.date===k)||D.quests.some(x=>x.due===k)||D.tx.some(x=>x.date===k);h+=`<div class="day ${k===dk(new Date())?'today':''} ${k===selected?'selected':''} ${has?'has':''}" onclick="pick('${k}')">${i}</div>`}$('cal').innerHTML=h}
function render(){let n=summary();$('appTitle').textContent=D.title;$('titleInput').value=D.title;$('homeBal').textContent=$('bal').textContent='¥'+D.money.toLocaleString();$('homeNet').textContent=$('net').textContent=(n>=0?'+':'')+'¥'+n.toLocaleString();let mv=moodValue(dk(new Date())),ms=[['😄','良い'],['🙂','普通'],['😐','微妙'],['😫','疲れた']];$('moods').innerHTML=ms.map(x=>`<button class="${mv===x[1]?'sel':''}" onclick="setMood('${x[1]}')">${x[0]}<div style="font-size:10px">${x[1]}</div></button>`).join('');$('moodText').textContent=mv?'今日は「'+mv+'」':'気が向いた時に1回タップするだけ。';let q=D.quests.find(x=>!x.status||x.status==='pending');$('nextQuest').innerHTML=q?`<b>${q.title}</b><div>${q.due||'期限なし'}</div><div class="resultBtns"><button class="achieve" onclick="setQuestResult(${q.id},'achieved')">✅ 達成</button><button class="miss" onclick="setQuestResult(${q.id},'missed')">❌ 未達成</button></div>`:'判定待ちクエストなし';$('rewardHome').innerHTML=rewardMarkup('week','今週')+rewardMarkup('month','今月');$('recentMemo').textContent=D.memos[0]?.text||'まだありません。';$('txList').innerHTML=D.tx.length?D.tx.slice(0,50).map(x=>`<div class="item row"><div><b>${x.cat}</b><div class="muted">${x.date} ${x.memo||''}</div></div><b>${x.type==='income'?'+':'-'}¥${x.amount.toLocaleString()}</b></div>`).join(''):'<div class="muted">履歴なし</div>';$('qList').innerHTML=D.quests.length?D.quests.map(x=>{let st=x.status||'pending',label=st==='achieved'?'✅ 達成':st==='missed'?'❌ 未達成':'⏳ 判定待ち';return `<div class="item"><div><b>${x.title}</b><div class="muted">${x.due||'期限なし'} ${x.memo||''}</div><span class="resultTag ${st}">${label}</span></div><div class="resultBtns"><button class="achieve" onclick="setQuestResult(${x.id},'achieved')">✅ 達成</button><button class="miss" onclick="setQuestResult(${x.id},'missed')">❌ 未達成</button>${st!=='pending'?`<button class="pending" onclick="resetQuestResult(${x.id})">↩ 判定待ち</button>`:''}</div></div>`}).join(''):'なし';$('memoList').innerHTML=D.memos.map(x=>`<div class="note">${x.text}<div class="row"><span class="muted">${x.date}</span><button class="danger" onclick="delMemo(${x.id})">削除</button></div></div>`).join('');$('weekThreshold').value=D.rewards.weekThreshold;$('weekReward').value=D.rewards.weekReward;$('monthThreshold').value=D.rewards.monthThreshold;$('monthReward').value=D.rewards.monthReward;$('selDate').textContent=selected;let logs=D.events.filter(x=>x.date===selected);$('dayLog').innerHTML=logs.map(x=>x.kind==='photo'?`<div class="item"><b>📷 ${x.title}</b><img class="photo" src="${x.data}"><button class="danger" onclick="delEvent(${x.id})">削除</button></div>`:`<div class="item row"><div><b>📅 ${x.time||''} ${x.title}</b><div class="muted">${x.memo||''}</div></div><button class="danger" onclick="delEvent(${x.id})">削除</button></div>`).join('')||'<div class="muted">この日の予定・写真はありません。</div>';renderCal();renderTimeline()}
$('txDate').value=$('qDue').value=dk(new Date());['7','8','9','÷','4','5','6','×','1','2','3','-','0','.','=','+','C','⌫'].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>cp(v);$('calc').appendChild(b)});tick();setInterval(tick,1000);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
